# Builds every display, merges each into a single flashable .bin, creates a
# GitHub release with the .bin files, and publishes the browser installer
# in docs/ to GitHub Pages.
#
#   Stable release:  push tag vX.Y.Z         -> release; main install buttons
#   Beta release:    push tag vX.Y.Z-beta.N  -> pre-release; installer's Beta
#                    section only. Stable buttons keep the latest stable.
#   docs/ change on main, or manual run      -> republish the page only
#
# The page itself always comes from main, and its firmware always comes from
# the releases, so a beta can never replace the stable install.
#
# One-time setup: Settings -> Pages -> Source: "GitHub Actions", and allow
# tags matching v* in Settings -> Environments -> github-pages.
name: Web installer

on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['docs/**']
  workflow_dispatch:

permissions:
  contents: write   # attach .bin files to releases
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # never cancel a release half way

jobs:
  build:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dir: ESP32-S3_Square_Display,              env: waveshare_square,   out: marine-display-square }
          - { dir: ESP32-S3_Square_Display-NMEA,         env: waveshare_square,   out: marine-display-square-nmea }
          - { dir: ESP32-S3_2.8in_IPS_LCD_Round_Display, env: waveshare_28_round, out: marine-display-round-28 }
          - { dir: ESP32-S3_2.1in_IPS_LCD_Round_Display, env: waveshare_21_round, out: marine-display-round-21 }
          - { dir: ESP32-S3_RLCD_4.2_Display,            env: waveshare_rlcd,     out: marine-display-rlcd-42 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ matrix.env }}-${{ hashFiles(format('{0}/platformio.ini', matrix.dir)) }}
      - run: pip install platformio
      - name: Build
        run: pio run -d "${{ matrix.dir }}" -e ${{ matrix.env }}
      - name: Merge into one image
        run: python tools/merge_firmware.py "${{ matrix.dir }}" ${{ matrix.env }} out/${{ matrix.out }}.bin
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: out/${{ matrix.out }}.bin

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Create GitHub release (pre-release for -beta tags)
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.bin
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}

  publish:
    needs: [build, release]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Collect firmware from releases
        run: |
          set -euo pipefail
          STABLE=$(gh release view --json tagName -q .tagName)
          STABLE_AT=$(gh release view "$STABLE" --json publishedAt -q .publishedAt)
          echo "Stable: $STABLE ($STABLE_AT)"
          gh release download "$STABLE" --pattern '*.bin' --dir docs
          sed -i "s/\"version\": \"dev\"/\"version\": \"$STABLE\"/" docs/manifest-*.json

          # Newest pre-release, shown only while it's newer than the stable release
          read -r BETA BETA_AT < <(gh release list --limit 50 --json tagName,isPrerelease,publishedAt \
            -q '[.[] | select(.isPrerelease)] | sort_by(.publishedAt) | last | "\(.tagName) \(.publishedAt)"') || true
          if [[ -n "${BETA:-}" && "$BETA" != "null" && "$BETA_AT" > "$STABLE_AT" && -d docs/beta ]]; then
            echo "Beta: $BETA ($BETA_AT)"
            for m in docs/beta/manifest-*.json; do
              bin=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['builds'][0]['parts'][0]['path'])" "$m")
              gh release download "$BETA" --pattern "$bin" --dir docs/beta
            done
            sed -i "s/\"version\": \"dev\"/\"version\": \"$BETA\"/" docs/beta/manifest-*.json
          else
            echo "No current beta"
            rm -rf docs/beta
          fi
          find docs -name '*.bin' -o -name 'manifest-*.json' | sort
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
