[platformio]
default_envs = waveshare_rlcd

[env:waveshare_rlcd]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; Serial monitor and upload settings
monitor_speed = 115200
upload_speed = 921600

build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++2a
    -DCORE_DEBUG_LEVEL=3
    -DLOG_LOCAL_LEVEL=3
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_USE_DRAW_SW_ASM=0
    -DLV_USE_NATIVE_HELIUM_ASM=0
    -DLV_USE_ARM2D=0
    ; Board has USB-C with CH343 USB-UART chip
    -DARDUINO_USB_CDC_ON_BOOT=1
    -I include
    -I src
    ; RLCD 4.2" is 400x300 in landscape mode
    -DSCREEN_WIDTH=400
    -DSCREEN_HEIGHT=300
    -DLV_HOR_RES_MAX=400
    -DLV_VER_RES_MAX=300
    ; Enable PSRAM for malloc/heap allocation
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    ; Redirect larger allocations to PSRAM
    -DCONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL=4096
    ; Reduce max open sockets
    -DCONFIG_LWIP_MAX_SOCKETS=6
    ; Increase loop() stack for web server handlers
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=16384
    ; Repo-root include path for shared version.h
    -I ..

; Inject firmware version + git hash at build time
extra_scripts =
    pre:../inject_version.py
    fix_ota_boot.py

; Memory Configuration - Board has 16MB Flash + 8MB OPI PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = dio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.offset_address = 0x100000
board_build.partitions = partitions.csv
board_build.filesystem = spiffs

lib_deps =
    lvgl/lvgl@^8.4.0
    bblanchon/ArduinoJson
    Links2004/WebSockets
